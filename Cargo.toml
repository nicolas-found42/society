[workspace]
resolver = "2"
members = ["crates/sim", "crates/server", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
society-sim = { path = "crates/sim" }

[profile.release]
opt-level = "s"
lto = true
